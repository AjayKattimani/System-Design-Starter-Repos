openapi: 3.0.0
info:
  title: Helios Task Management API
  version: 1.0.0
  description: |
    This is the BROKEN contract for the Helios task completion endpoint.
    Your job is to find and fix all three design violations.

paths:
  /tasks/{id}/complete:
    get:
      summary: Complete a task
      description: |
        Marks a task as completed. Uses GET because we wanted a simple, stateless operation.
      operationId: completeTask
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The task ID to complete
      responses:
        '200':
          description: Task completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Internal task ID
                  task_ref:
                    type: string
                  title:
                    type: string
                  assigned_user_id:
                    type: integer
                  created_by_user_id_fk:
                    type: integer
                    description: Foreign key to user who created the task
                  internal_priority_score:
                    type: number
                    description: Internal calculation used for prioritization
                  project_id:
                    type: integer
                  completed_at:
                    type: string
                    format: date-time
                  internal_db_version:
                    type: string
                    description: Row version for optimistic locking
              example:
                id: 42
                task_ref: TSK-2024-001
                title: Fix login form validation
                assigned_user_id: 7
                created_by_user_id_fk: 5
                internal_priority_score: 87.3
                project_id: 12
                completed_at: '2024-05-19T14:32:00Z'
                internal_db_version: 'v2.1.3'
        '400':
          description: Task ID is missing or invalid
        '404':
          description: Task not found
